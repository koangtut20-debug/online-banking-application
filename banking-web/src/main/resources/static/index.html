<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Banking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 12px;
        }

        .header p {
            margin: 6px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #1f4e79;
        }

        .balance {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0;
        }

        .account-info p {
            margin: 12px 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .refresh {
            background: #555;
        }

        .transactions {
            margin-top: 25px;
        }

        .transactions h2 {
            color: #1f4e79;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1f4e79;
            color: white;
        }

        .logout {
            width: 180px;
            margin-top: 25px;
            background: #b22222;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .logout {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Welcome, <span id="userName">User</span></h1>
    <p>Account Number: <strong id="accountNumber"></strong></p>
    <p>Account Type: <strong id="accountType"></strong></p>
    <p>Status: <strong id="accountStatus"></strong></p>
</div>

<div class="container">

    <div class="dashboard">

        <div class="card">
            <h2>Balance</h2>
            <div class="balance" id="balance">₹0.00</div>
            <button class="refresh" onclick="loadAccount()">Refresh Balance</button>
        </div>

        <div class="card account-info">
            <h2>Account Details</h2>
            <p>Holder: <strong id="holder"></strong></p>
            <p>Account: <strong id="accountDetailsNumber"></strong></p>
            <p>Type: <strong id="type"></strong></p>
            <p>Status: <strong id="status"></strong></p>
        </div>

        <div class="card">
            <h2>Deposit</h2>
            <input type="number" id="depositAmount" placeholder="Enter amount">
            <button onclick="deposit()">Deposit</button>
        </div>

        <div class="card">
            <h2>Withdraw</h2>
            <input type="number" id="withdrawAmount" placeholder="Enter amount">
            <button onclick="withdraw()">Withdraw</button>
        </div>

    </div>

    <div class="card transactions">
        <h2>Transaction History</h2>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Balance After</th>
                </tr>
            </thead>

            <tbody id="transactionBody">
                <tr>
                    <td colspan="4">Loading transactions...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="logout" onclick="logout()">Logout</button>

</div>

<script>

const accountNumber = localStorage.getItem("accountNumber");
const userName = localStorage.getItem("name") || "User";

if (!accountNumber) {
    window.location.href = "/login.html";
}

document.getElementById("userName").textContent = userName;
document.getElementById("accountNumber").textContent = accountNumber;
document.getElementById("accountDetailsNumber").textContent = accountNumber;
document.getElementById("holder").textContent = userName;

async function loadAccount() {

    try {

        const response = await fetch(
            `/api/account?accountNumber=${accountNumber}`
        );

        if (!response.ok) {
            throw new Error("Account not found");
        }

        const account = await response.json();

        document.getElementById("balance").textContent =
            "₹" + Number(account.balance).toFixed(2);

        document.getElementById("accountType").textContent =
            account.accountType || "";

        document.getElementById("accountStatus").textContent =
            account.status || "";

        document.getElementById("type").textContent =
            account.accountType || "";

        document.getElementById("status").textContent =
            account.status || "";

    } catch (error) {
        console.error(error);
    }
}

async function deposit() {

    const amount = Number(
        document.getElementById("depositAmount").value
    );

    if (!amount || amount <= 0) {
        alert("Please enter a valid deposit amount.");
        return;
    }

    try {

        const response = await fetch("/api/account/deposit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                accountNumber: accountNumber,
                amount: amount
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Deposit failed.");
            return;
        }

        document.getElementById("depositAmount").value = "";

        await loadAccount();
        await loadTransactions();

        alert("Deposit successful!");

    } catch (error) {

        console.error(error);
        alert("Something went wrong.");

    }
}

async function withdraw() {

    const amount = Number(
        document.getElementById("withdrawAmount").value
    );

    if (!amount || amount <= 0) {
        alert("Please enter a valid withdrawal amount.");
        return;
    }

    try {

        const response = await fetch("/api/account/withdraw", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                accountNumber: accountNumber,
                amount: amount
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Withdrawal failed.");
            return;
        }

        document.getElementById("withdrawAmount").value = "";

        await loadAccount();
        await loadTransactions();

        alert("Withdrawal successful!");

    } catch (error) {

        console.error(error);
        alert("Something went wrong.");

    }
}

async function loadTransactions() {

    try {

        const response = await fetch(
            `/api/transactions?accountNumber=${accountNumber}`
        );

        if (!response.ok) {
            throw new Error("Could not load transactions");
        }

        const transactions = await response.json();

        const body = document.getElementById("transactionBody");

        if (!transactions || transactions.length === 0) {

            body.innerHTML =
                '<tr><td colspan="4">No transactions yet.</td></tr>';

            return;
        }

        body.innerHTML = "";

        transactions.forEach(transaction => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${transaction.date || ""}</td>
                <td>${transaction.type || ""}</td>
                <td>₹${Number(transaction.amount || 0).toFixed(2)}</td>
                <td>₹${Number(transaction.balanceAfter || 0).toFixed(2)}</td>
            `;

            body.appendChild(row);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("transactionBody").innerHTML =
            '<tr><td colspan="4">Unable to load transactions.</td></tr>';
    }
}

function logout() {

    localStorage.removeItem("accountNumber");
    localStorage.removeItem("name");
    localStorage.removeItem("email");

    window.location.href = "/login.html";
}

loadAccount();
loadTransactions();

</script>

</body>
</html>
